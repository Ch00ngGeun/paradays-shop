language: "ko"
reviews:
  profile: "chill"
  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - "^main$"
      - "^dev$"
  path_filters:
    - "!**/node_modules/**"
    - "!**/dist/**"
    - "!**/build/**"
    - "!**/*.lock"
    - "!**/.next/**"
    - "!out/**"
    - "!infra/cdk.out/**"
    - "!_backup/**"
    - "!test-results/**"
    - "!playwright-report/**"
    - "!**/package-lock.json"
    - "!**/*.tsbuildinfo"
knowledge_base:
  code_guidelines:
    enabled: true
    filePatterns:
      - "CODE_REVIEW_GUIDELINES.md"
