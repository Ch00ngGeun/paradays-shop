language: "ko"
reviews:
  profile: "chill"
  high_level_summary: true
  high_level_summary_instructions: |-
    PR diff와 제공된 검증 증거만 근거로 아래 5항목을 한국어로 간결하게 작성함.
    테스트 파일·소스만 보고 실행 통과·배포·사용자 인수를 추정하지 않음.
    이 지침은 요약 형식이며 명령 실행이나 새 로그 생성을 요구하지 않음.
    1. 변경 기능·영향 화면: 무엇이 달라지고 어느 화면에 영향을 주는지 설명함.
    2. 실제 데이터 영향: 결제·재고·장부의 실제 처리에 미치는 영향과 미확인 범위를 구분함.
    3. 검증 근거·제약: 확인된 테스트 결과와 미실행 항목·환경 제약을 구분함.
    4. 사용자 직접 검증 흐름: 대상 화면의 진입·조작·예상 결과를 짧게 제시하고 미실행 여부를 명시함.
    5. 복구 주의: 호환성과 데이터·증거 보존 조건을 설명함. 확정 금융 데이터가 생긴 뒤 구형 코드만 부분 복구해도 안전하다고 단정하지 않음.
  high_level_summary_in_walkthrough: true
  review_details: true
  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - "^main$"
      - "^dev$"
  path_filters:
    - "!**/node_modules/**"
    - "!**/dist/**"
    - "!**/build/**"
    - "!**/*.lock"
    - "!**/.next/**"
    - "!out/**"
    - "!infra/cdk.out/**"
    - "!test-results/**"
    - "!playwright-report/**"
    - "!**/package-lock.json"
    - "!**/*.tsbuildinfo"
  path_instructions:
    - path: "infra/lambda/admin-*.ts"
      instructions: >-
        기존 JWT 검증 경계와 subject를 바탕으로 서버에서 Cognito 그룹 이름 admin의
        정확 일치를 확인하는지 검토함. 그룹 claim 누락 시 기존 서버 조회를 유지하고
        인증·권한 확인 실패는 거부하는지 확인함. 권한 판정용 Cognito 조회를 제외한
        DB·결제·OCR 등 외부 provider의 읽기·쓰기는 관리자 권한 확인 뒤에 시작하는지
        검토함. 내부 receipt·claim·revision을 공개 목록·공개 응답에 노출하지 않고
        token·자격정보를 로그에 남기지 않는지 확인함.
    - path: "{lib/auth/**,contexts/auth-context.tsx,infra/lib/**}"
      instructions: >-
        클라이언트 화면 가드만으로 서버 관리자 권한이 부여되지 않는지 검토함.
        관리자 API route의 기존 JWT 검증·서버 admin 권한 확인과 필요한 최소 IAM을
        유지하는지 확인함. NEXT_PUBLIC 설정이나 정적 산출물에 비밀을 넣지 않는지
        검토함. 기존 PKCE·state 검증과 안전한 return 경로 경계를 유지하며
        개인정보·token·자격정보를 로그에 남기지 않는지 확인함.
    - path: "infra/lambda/{checkout-handler,payment-*-handler,admin-refund-handler,order-inventory-*,order-refunds,toss-payments}.ts"
      instructions: >-
        공통 writer에서 함께 변경되는 주문·상품 version/CAS, 재고·예약·catalog
        revision·금융 사건이 동일 DB transaction으로 일관되게 반영되는지 검토함.
        동일 operationId와 fingerprint의 재시도·중복 웹훅에서 차감·환불·재고 복원이
        중복되지 않고 다른 본문의 식별자 재사용을 거부하는지 확인함. PG 결과가
        불명확하면 확정 실패 처리·예약 자동 해제·새 식별자 재실행을 하지 않고
        기존 요청과 잠금을 보존해 서버 재조회·대조하는지 검토함. 미출고 확정 취소의
        해당 수량은 한 번만 복원하고 출고 후에는 실제 입고·검수한 재판매 가능
        수량만 복원하는지 확인함. 금전 환불만으로 물리 반품을 가정하거나 차감 증거
        없는 과거 주문의 재고를 복원하지 않는지 검토함. 예약 침범·음수 재고·부분
        반영을 막는 조건과 원자성을 확인함.
    - path: "{infra/lambda/{admin-sales-handler,sales-ledger-*,sales-request-deadline}.ts,lib/commerce/admin-sales-api-client.ts,components/admin-sales-ledger.tsx}"
      instructions: >-
        DRAFT 저장 뒤 재고 예정표의 previewToken과 관련 version을 확인하고 명시적
        확인 후 POSTED로 전환하는지 검토함. 같은 전표·요청의 재시도로 재고를 다시
        차감하지 않는지 확인함. POSTED 전표를 직접 수정·삭제하지 않고 원전표에
        연결한 반대전표와 감사 기록을 보존하며 금액 정정만으로 재고를 복원하지
        않는지 검토함. Asia/Seoul 기준 원승인 영업일의 매출을 유지하고 환불은
        별도 환불 사건의 영업일에 귀속하며 공급자 발생 시각과 서버 관측 시각을
        구분하는지 확인함. 일마감 확정 전에 전체 페이지 조회와 요청 전체 deadline,
        온라인 fingerprint를 확인하고 불완전 조회·시간 초과·불일치를 부분 합계나
        마감 가능 상태로 반환하지 않는지 검토함. 마감 때 이미 반영한 재고를 다시
        차감하지 않고 기존 마감본·재개방 이력·사유를 보존하는지 확인함.
    - path: "{services/paddle-ocr/**,scripts/local-ocr-relay.ts,infra/lambda/{paddle-ocr,admin-ocr-handler,ocr-table-parser,catalog-intake,admin-catalog-handler}.{ts,js},lib/admin-ui/ocr-*,components/ocr-*,lib/commerce/admin-api-client.ts}"
      instructions: >-
        canonical rec_texts·rec_scores·rec_boxes 계약과 유효한 기존 box를 보존하고
        rec_polys는 같은 인덱스의 누락·잘못된 box 슬롯만 보완하는지 검토함.
        서버 원본 토큰의 원문·confidence·box와 사용자 수정값을 구분하고 클라이언트
        metadata를 신뢰하지 않는지 확인함. 선언 MIME과 실제 bytes의 일치, 기존
        파일·해상도·응답 크기 한도와 메모리 내 decode, 요청 전체 deadline을 검토하고
        비밀은 서버에만 두는지 확인함. 표의 행·열·수량이 모호하면 수동 확인을
        요구하며 금액·단가를 수량으로 추정하거나 누락 값을 자동 확정하지 않는지
        검토함. 검토본 저장과 실제 재고 쓰기를 분리하고 기존 상품은 확인한 버전의
        재고에 입고 수량을 더하며 신규 상품은 가격·허용 category·명시적 확인을
        요구하는 비공개 DRAFT인지 확인함. 상품과 operation receipt, job/row claim,
        revision을 같은 transaction으로 처리해 재시도·행 묶음 분할·합치기의 중복
        입고를 막는지 검토함. 일부 성공·실패·응답 불명확·미실행을 구분하고 무조건
        자동 재시도·롤백·재등록하지 않으며 새 이미지·새 job까지 같은 실물 입고로
        식별한다고 보장하지 않는지 확인함.
    - path: "{components/**/*.{tsx,css},hooks/**,lib/admin-ui/{navigation,store-return,*simulation}.ts,contexts/**,app/**}"
      instructions: >-
        관리자 메뉴의 브라우저 뒤로·앞으로 이동과 새로고침, 원래 상품 상세로의
        returnTo 복귀와 직전 메뉴 adminSection 왕복이 기존 허용 목록을 따르는지
        검토함. 외부·위험 경로와 인증값·개인정보 query를 전달하거나 관리자·인증
        화면 순환을 만들지 않는지 확인함. 이 왕복 경로의 복원은 메뉴로 한정하고
        초안·editor·File·token·실제/모의 모드를 자동 복원하지 않는지 검토함.
        실제 요청 진행 중·결과 불명확 상태의 잠금을 모드 전환으로 우회하거나
        요청을 자동 재전송하지 않는지 확인함. 모의 전용 모델·동작은 합성 TEST
        데이터와 화면 메모리만 사용하며 실제 API·상품·장부·token·실제 pending
        storage에 연결하거나 해당 데이터를 복사·삭제하지 않는지 검토함.
        로그아웃·계정 교체 때 모의 세션·편집 메모리의 폐기 경계를 확인함.
        키보드·Tab·Escape 조작과 다이얼로그 초기 포커스·trap·닫힘 후 복원,
        dialog label·오류 알림·의미에 맞는 HTML을 검토함. 320~390px 모바일 폭과
        확대 사용에서 불필요한 가로 넘침·가려지는 조작이 없는지 확인함. 기존
        Next.js 정적 export와 지원 React 사용법, 브라우저 전용 API의 실행 경계와
        hydration 호환성을 유지하는지 검토함.
    - path: "{tests/**,infra/test/**,e2e/**,services/paddle-ocr/tests/**,playwright*.config.ts,vitest.config.ts}"
      instructions: >-
        변경 위험에 관련된 정상·권한 거부·중복 재시도·시간 초과·부분 실패·동시성과
        수량 경계·복구 사례를 검토하며 매번 전체 테스트 실행을 강제하지 않음.
        금융의 중복 차감·환불·재고 복원과 OCR의 입력·canonical·수동 검토·입고
        계약, 모의/실제 분리에 필요한 사례와 관측 가능한 결과 단언을 확인함.
        expect 삭제·skip/todo 추가·timeout 확대·계약과 맞지 않는 fixture·검증 대상
        storage 삭제만으로 실패를 숨기는 약화를 지적하되 타당한 수정은 원인과
        보존된 검증 근거를 구분해 판단함. 문서 탐색은 navigation commit과 새 화면
        준비를 기다려 URL만 바뀐 이전 DOM으로 통과하는 경합을 막는지 확인함.
        테스트 독립성과 결정적인 단언을 유지하고 필요한 fake clock·비동기 대기를
        사용하며 임의 sleep이나 실행 순서에 의존하지 않는지 검토함. 테스트 파일의
        존재와 실행 통과를 구분하고 단위·mock·브라우저·CI 결과를 실제 연동 검증으로
        확대하지 않는지 확인함. 실제 계정·운영 쓰기를 임의로 사용하거나 비밀을
        fixture에 넣지 않으며 사진·실물 OCR 품질을 mock 성공으로 보장하지 않는지
        검토함.
  pre_merge_checks:
    custom_checks:
      - name: "Admin API authorization"
        mode: "warning"
        instructions: >-
          PR diff와 제공된 코드·PR 증거만 읽는 AI 검토임. 신규·변경 관리자 route나
          handler가 없으면 PASS(N/A)로 판단함. 관련 변경이 있으면 검증된 JWT와
          정확한 admin 권한 확인이 데이터 접근 전에 이루어지는 호출 경로의 파일과
          위치 근거를 확인함. 그 경로에서 인증·권한 검증 우회나 누락이 코드로
          확인되면 FAIL, 각 변경 경로의 검증 근거가 확인되면 PASS로 판단함.
          호출 경로나 자료가 부족하면 Inconclusive로 표시하고 누락을 추정하지 않음.
          sandbox·자료 한계를 명시하며 테스트 suite 직접 실행·새 CI 성공·실운영
          로그인·운영 쓰기를 요구하지 않음.
      - name: "OCR response compatibility"
        mode: "warning"
        instructions: >-
          PR diff와 제공된 코드·PR 증거만 읽는 AI 검토임. OCR 응답·변환 계약과
          관련된 변경이 없으면 PASS(N/A)로 판단함. 관련 변경은 canonical
          rec_texts·rec_scores·rec_boxes와 유효한 box 보존, 같은 인덱스 rec_polys의
          누락·잘못된 box 슬롯 보완을 확인함. 영향받는 타입·어댑터와 기존·추가
          테스트의 정합 근거가 확인되면 PASS, 관련 계층의 갱신 누락이나 키·인덱스
          호환성 파괴가 코드로 확인되면 FAIL로 판단함. 판단할 자료가 부족하면
          Inconclusive로 표시하며 실행 근거 없이 테스트 통과를 주장하지 않음.
          sandbox·자료 한계를 명시하며 테스트 suite 직접 실행·새 CI 성공·실운영
          로그인·운영 쓰기를 요구하지 않음.
      - name: "Sensitive data exposure"
        mode: "warning"
        instructions: >-
          PR diff와 제공된 코드·PR 증거만 읽는 AI 검토임. 새로 추가·변경된 실제
          비밀·인증 cookie·JWT·password·개인정보 리터럴이나 민감값의 로그 유입을
          확인함. 실제 민감값의 포함 또는 로그까지의 데이터 흐름이 코드로 확인되는
          고신뢰 노출만 FAIL로 판단함. 단순 변수명·필드명·명백한 placeholder·합성
          TEST 데이터는 노출로 판단하지 않음. 해당 노출이 없으면 PASS(N/A 포함),
          민감성이나 데이터 흐름이 불명확하면 Inconclusive로 판단함. 보고에는
          파일·위치·노출 종류만 적고 의심값을 복사하거나 복제하지 않음.
          sandbox·자료 한계를 명시하며 테스트 suite 직접 실행·새 CI 성공·실운영
          로그인·운영 쓰기를 요구하지 않음.
      - name: "Critical regression evidence"
        mode: "warning"
        instructions: >-
          PR diff와 제공된 코드·PR 증거만 읽는 AI 검토임. 금융·입고·장부 상태나
          저장소 쓰기·복구 동작을 바꾸지 않는 형식·문서 변경은 PASS(N/A)로 판단함.
          관련 동작 변경은 위험에 맞는 중복 요청과 실패·복구 사례의 기존·추가
          테스트 및 제공된 실행 근거를 확인함. 그 근거에서 중복 반영·원자성 상실
          같은 회귀가 확인되면 FAIL, 필요한 사례와 그 실행 결과가 확인되면 PASS로
          판단함. 관련 테스트·실행 자료가 부족하거나 실행 불가이면 Inconclusive로
          표시함. 파일 존재만으로 실행 통과를 추정하지 않으며 관련 없는 전체 검사나
          새 로그를 요구하지 않음. sandbox·자료 한계를 명시하며 테스트 suite 직접
          실행·새 CI 성공·실운영 로그인·운영 쓰기를 요구하지 않음.
knowledge_base:
  code_guidelines:
    enabled: true
    filePatterns:
      - "CODE_REVIEW_GUIDELINES.md"
